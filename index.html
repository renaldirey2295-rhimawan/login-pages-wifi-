<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login WiFi - Redmi Note 13 5G</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e90ff, #00c896);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 350px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      outline: none;
      text-align: center;
    }
    button {
      width: 100%;
      background: #ffffff;
      color: #333;
      border: none;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover {
      background: #eee;
      transform: scale(1.03);
    }
    p {
      margin-top: 15px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Selamat Datang Kaum-kaum Miskin Kuota</h1>
    <form id="loginForm">
      <input type="text" placeholder="Masukkan Nama Anda" required>
      <button type="submit">Login Wi-Fi</button>
    </form>
    <p>WiFi untuk orang miskin</p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      window.location.href = "https://instagram.com/renaldirey1";
    });
  </script>
</body>
</html>
